<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommender System</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        /* Add a class like 'movie-poster' to your poster images */
.movie-poster {
    border-radius: 10px;
    transition: transform 0.3s ease-out, box-shadow 0.3s ease-out;
}

.movie-poster:hover {
    transform: scale(1.08) translateY(-5px);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    cursor: pointer;
}

        #search-box {
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    border: 2px solid transparent;
}

#search-box:focus {
    transform: scale(1.02); /* Makes the bar slightly wider */
    box-shadow: 0 0 15px rgba(13, 110, 253, 0.4); /* Bootstrap blue glow */
    border: 2px solid #0d6efd;
    outline: none;
}

        #movieList li {
    /* The animation triggers every time JS changes display to block */
    animation: slideDownFade 0.3s ease forwards;
    opacity: 0; /* Starts invisible */
}

@keyframes slideDownFade {
    0% {
        opacity: 0;
        transform: translateY(-10px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}
        /* Apply this to the container holding your 5 recommended movies */
.recommendations-container {
    animation: fadeInUp 0.8s ease-out;
}

@keyframes fadeInUp {
    0% {
        opacity: 0;
        transform: translateY(30px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}
        /*  */
        /*  */
        /*  */
        /*  */

        .result{
            background-color: rgb(134, 137, 139);
            margin-top: 5px;
            border-radius: 10px;
            height: max-content;
            padding-bottom: 10px;
            padding-top: 5px;
        }
        ul>li{
            padding: 5px;
        }
        #search-container{
            width: 50%;
            height: 300px;
            align-items: center;
            margin: auto;
        }
        #search-box{

            width: 100%;
            height: 40px;
            border-radius: 15px;
            border: none;
            background-color: rgb(81, 85, 88);
            padding-left: 20px;
        }
        .button{
            position: absolute;
            right: 1px;
        }
        #1{
            display: flex;
            align-items: center;
        }
/* Add this to your CSS */
#movieList li {
    display: none;
}
 
    </style>


</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">Movie Recommender System</h1>

    <!-- Search Form -->
    <div class="row justify-content-center">
        <div class="col-md-8" style="width: 100%;">
            <form method="POST" action="/">
                <div id="1" class="input-group mb-3" style="position: relative;">
                    <div id="search-container">
                    
                        <input type="text" name="movie_name" id="search-box" onkeypress="text()">

                        <div class="result">
                        
                            <ul id="movieList">
                        {% for movie in movies %}
                                <li  id="hide" value="{{ movie }}" >{{ movie }}</li>
                            {% endfor %}
                            </ul>
                        </div>
                    
                    </div>
                    <div class="button">
                    <button class="btn btn-primary" type="submit">Show Recommendations</button>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <!-- Loading Spinner Container (By default display: none) -->
<div id="loading-spinner" style="display: none; text-align: center; margin-top: 50px;">
    <!-- Bootstrap 5 Spinner -->
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <h4 class="mt-3" style="color: white;">Fetching Posters... Please wait 🍿</h4>
</div>

    <!-- Recommendations Grid -->
    {% if recommendations %}
    <div class="row mt-5">
        <h3 class="mb-4 text-center">Top 5 Recommendations</h3>
        <!-- Loop through the zipped names and posters -->
        {% for name, poster in recommendations %}
        <div class="col-md-2 offset-md-0 col-sm-6 offset-sm-3 mb-4 mx-auto">
            <div class="card bg-secondary text-white h-100">
                <img src="{{ poster }}" class="card-img-top" alt="{{ name }}">
                <div class="card-body text-center p-2">
                    <h6 class="card-title mb-0">{{ name }}</h6>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

</div>
<script src="/static/main.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
